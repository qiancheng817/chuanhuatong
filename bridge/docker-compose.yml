services:
  chuanhuatong-bridge:
    build: .
    image: chuanhuatong-bridge:latest
    container_name: chuanhuatong-bridge
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8788:8788"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
