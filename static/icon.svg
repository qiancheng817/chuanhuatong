<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9bff"/>
      <stop offset="1" stop-color="#2f6be8"/>
    </linearGradient>
  </defs>
  <!-- 圆角底 -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <!-- 左纸杯（开口朝左） -->
  <polygon points="92,172 210,234 210,278 92,340" fill="#ffffff" opacity="0.95"/>
  <line x1="92" y1="172" x2="92" y2="340" stroke="#dce8ff" stroke-width="10" stroke-linecap="round"/>
  <!-- 右纸杯（开口朝右） -->
  <polygon points="420,172 302,234 302,278 420,340" fill="#ffffff" opacity="0.95"/>
  <line x1="420" y1="172" x2="420" y2="340" stroke="#dce8ff" stroke-width="10" stroke-linecap="round"/>
  <!-- 连接两个杯底的线（略带弧度） -->
  <polyline points="210,256 256,272 302,256" fill="none" stroke="#ffffff"
    stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
